[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "equitylens-ai"
version = "0.1.0"
description = "Source-backed research dashboard for Singapore banks"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "plotly>=5.24,<8", "streamlit>=1.50,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pypdf>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
